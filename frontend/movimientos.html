<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis movimientos | DASON</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/inicio.css?v=selector2">
<script src="js/aporte.js?v=selector2" defer></script>
<script src="js/personal.js" defer></script>
</head>
<body class="private">
<header><div class="bar"><a class="logo" href="inicio.html">DASON</a><button id="logout" class="btn btn-outline">Cerrar sesión</button></div></header>
<main><nav class="actions" aria-label="Panel personal"><a href="inicio.html" class="btn btn-outline">Mi inicio</a><a class="btn btn-outline" href="metas.html">Metas</a></nav><h1>Mis movimientos</h1><p id="status" role="status"></p><section><form id="filters"><label>Descripción<input name="query" type="search"></label><label>Mes<input name="month" type="month"></label><label>Tipo<select name="kind"><option value="">Todos</option><option value="income">Ingresos</option><option value="expense">Gastos</option></select></label><label>Categoría<select name="category"><option value="all">Todas</option><option value="">Sin categoría</option><option>Alimentación</option><option>Transporte</option><option>Vivienda</option><option>Salud</option><option>Ocio</option><option>Otros</option></select></label></form>
<form id="edit" hidden><label>Tipo<select name="kind"><option value="income">Ingreso</option><option value="expense">Gasto</option></select></label>
<label id="goal-choice" hidden>Apartar para una meta
  <span class="goal-picker"><select name="goal_key"><option value="">Sin aporte</option></select></span>
</label>
<label id="goal-portion" hidden>Monto para la meta ($)<input name="portion" type="number" min="0.01" step="0.01" disabled></label>
<small id="goal-help" hidden>Para apartar parte de este ingreso, <a href="metas.html">crea tu primera meta</a>.</small>
<label id="category-field" hidden>Categoría<select name="category"><option value="">Sin categoría</option><option>Alimentación</option><option>Transporte</option><option>Vivienda</option><option>Salud</option><option>Ocio</option><option>Otros</option></select></label><label>Monto ($)<input name="amount" type="number" min="0.01" step="0.01" max="999999999999.99" required></label><label>Fecha<input name="day" type="date" required></label><label>Descripción<input name="note" maxlength="200"></label>

<button class="btn btn-primary">Guardar cambios</button><button id="cancel" class="btn btn-outline" type="button">Cancelar</button></form>
<p id="empty">No hay movimientos que coincidan.</p><ul id="list"></ul></section></main></body></html>
